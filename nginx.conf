map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map "$request_method:$http_accept" $policy_ui_document {
    default 0;
    ~^GET:.*text/html 1;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    location = / {
        return 302 /admin/ui/;
    }

    location = /admin/ui {
        return 302 /admin/ui/;
    }

    location = /admin/ui/policies {
        error_page 418 = @policy_ui_document;
        if ($policy_ui_document) { return 418; }
        proxy_pass http://s3proxy-control:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location @policy_ui_document {
        try_files /index.html =404;
    }

    location ~ ^/admin/ui/(backends(?:/|$|\?)|virtual-buckets(?:/|$|\?)|mapping-backends/|roles(?:/|$|\?)|role-policies(?:$|\?)|identities(?:/|$|\?)|policies(?:/|$|\?)|bucket-policies(?:/|$|\?)) {
        proxy_pass http://s3proxy-control:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /admin/ui/ {
        rewrite ^/admin/ui/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location /admin/ {
        proxy_pass http://s3proxy-control:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
