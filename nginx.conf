map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map "$request_method:$http_accept" $policy_ui_document {
    default 0;
    ~^GET:.*text/html 1;
}

map $request_uri $ui_cache_control {
    default "no-store";
    ~^/admin/ui/assets/.+\.(css|js|woff2?)$ "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control $ui_cache_control always;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    location = / {
        return 302 /admin/ui/;
    }

    location = /admin/ui {
        return 302 /admin/ui/;
    }

    location = /admin/ui/policies {
        error_page 418 = @policy_ui_document;
        if ($policy_ui_document) { return 418; }
        proxy_pass http://s3proxy-control:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location @policy_ui_document {
        try_files /index.html =404;
    }

    location ~ ^/admin/ui/assets/.+\.(css|js|woff2?)$ {
        rewrite ^/admin/ui/(.*)$ /$1 break;
        try_files $uri =404;
    }

    location ~ ^/admin/ui/(backends(?:/|$|\?)|virtual-buckets(?:/|$|\?)|mapping-backends/|roles(?:/|$|\?)|role-policies(?:$|\?)|identities(?:/|$|\?)|policies(?:/|$|\?)|bucket-policies(?:/|$|\?)) {
        proxy_pass http://s3proxy-control:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /admin/ui/ {
        rewrite ^/admin/ui/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location /admin/ {
        proxy_pass http://s3proxy-control:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
