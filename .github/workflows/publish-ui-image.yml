name: Publish UI image
run-name: "Publish UI image to ${{ inputs.release_environment }}"

on:
  workflow_call:
    inputs:
      release_environment:
        description: Protected release environment
        required: true
        type: string
      deploy_to_aks:
        description: Deploy the published image to AKS
        required: false
        type: boolean
        default: false
      network_policy_enabled:
        description: Render the UI NetworkPolicy
        required: false
        type: boolean
        default: false
    outputs:
      ui_digest:
        description: Published UI image digest
        value: ${{ jobs.publish.outputs.ui_digest }}
      ui_revision:
        description: Source revision embedded in the UI image
        value: ${{ jobs.publish.outputs.ui_revision }}
  workflow_dispatch:
    inputs:
      release_environment:
        description: Protected release environment
        required: true
        type: choice
        options: [staging, production]
        default: staging
      deploy_to_aks:
        description: Deploy the published image to AKS
        required: true
        type: boolean
        default: true
      network_policy_enabled:
        description: Render the UI NetworkPolicy
        required: true
        type: boolean
        default: false

concurrency:
  group: publish-ui-image-${{ inputs.release_environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.release_environment }}
    outputs:
      ui_digest: ${{ steps.ui.outputs.digest }}
      ui_revision: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.S3PROXY_AZURE_SUBSCRIPTION_ID }}

      - name: Login Docker to ACR
        id: acr
        env:
          ACR_NAME: ${{ vars.S3PROXY_ACR_NAME }}
        run: |
          set -euo pipefail
          [[ -n "$ACR_NAME" ]] || { echo "Missing S3PROXY_ACR_NAME" >&2; exit 1; }
          az acr login --name "$ACR_NAME"
          echo "login_server=${ACR_NAME}.azurecr.io" >> "$GITHUB_OUTPUT"

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Build and validate assets
        run: |
          npm ci --ignore-scripts --registry=https://registry.npmjs.org/
          npm run lint
          npm test
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Build and publish immutable image
        id: ui
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.acr.outputs.login_server }}/s3proxy-ui:${{ github.sha }}
          provenance: mode=max
          sbom: true
          build-args: |
            OCI_REVISION=${{ github.sha }}

      - name: Pull immutable image
        env:
          UI_IMAGE: ${{ steps.acr.outputs.login_server }}/s3proxy-ui@${{ steps.ui.outputs.digest }}
        run: docker pull "$UI_IMAGE"

      - name: Verify image contents
        env:
          UI_IMAGE: ${{ steps.acr.outputs.login_server }}/s3proxy-ui@${{ steps.ui.outputs.digest }}
          UI_EXPECTED_REVISION: ${{ github.sha }}
        run: scripts/verify-ui-image.sh

      - name: Scan release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.acr.outputs.login_server }}/s3proxy-ui@${{ steps.ui.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Sign immutable image
        env:
          LOGIN_SERVER: ${{ steps.acr.outputs.login_server }}
          UI_DIGEST: ${{ steps.ui.outputs.digest }}
        run: cosign sign --yes "${LOGIN_SERVER}/s3proxy-ui@${UI_DIGEST}"

  deploy:
    name: Deploy signed UI to ${{ inputs.release_environment }} AKS
    if: inputs.deploy_to_aks
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-ui.yml
    with:
      deployment_environment: ${{ inputs.release_environment }}
      ui_digest: ${{ needs.publish.outputs.ui_digest }}
      ui_revision: ${{ needs.publish.outputs.ui_revision }}
      network_policy_enabled: ${{ inputs.network_policy_enabled }}
    secrets: inherit
