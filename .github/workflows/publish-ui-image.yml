name: Publish UI image
run-name: "Publish UI image to ${{ inputs.release_environment }}"

on:
  workflow_call:
    inputs:
      release_environment:
        description: Protected release environment
        required: true
        type: string
      deploy_to_aks:
        description: Deploy the published image to AKS
        required: false
        type: boolean
        default: false
      network_policy_enabled:
        description: Render the UI NetworkPolicy
        required: false
        type: boolean
        default: false
    outputs:
      ui_digest:
        description: Published UI image digest
        value: ${{ jobs.publish.outputs.ui_digest }}
      ui_revision:
        description: Source revision embedded in the UI image
        value: ${{ jobs.publish.outputs.ui_revision }}
  workflow_dispatch:
    inputs:
      release_environment:
        description: Protected release environment
        required: true
        type: choice
        options: [staging, production]
        default: staging
      deploy_to_aks:
        description: Deploy the published image to AKS
        required: true
        type: boolean
        default: true
      network_policy_enabled:
        description: Render the UI NetworkPolicy
        required: true
        type: boolean
        default: false

concurrency:
  group: publish-ui-image-${{ inputs.release_environment }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  validate:
    if: github.repository == 'cloudinfraz/s3proxy-rs-ui' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RELEASE_ENVIRONMENT: ${{ inputs.release_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted release source
        run: node scripts/release/verify-release-source.mjs "$RELEASE_ENVIRONMENT" "$GITHUB_SHA"

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Run shared release validation
        run: bash scripts/release/validate-ui.sh

      - name: Upload validated static assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-ui-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.release_environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      ui_digest: ${{ steps.ui.outputs.digest }}
      ui_revision: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download validated static assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-ui-${{ github.sha }}
          path: dist/

      - name: Azure login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.S3PROXY_AZURE_SUBSCRIPTION_ID }}

      - name: Login Docker to ACR
        id: acr
        env:
          ACR_NAME: ${{ vars.S3PROXY_ACR_NAME }}
        run: |
          set -euo pipefail
          [[ -n "$ACR_NAME" ]] || { echo "Missing S3PROXY_ACR_NAME" >&2; exit 1; }
          az acr login --name "$ACR_NAME"
          echo "login_server=${ACR_NAME}.azurecr.io" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Build and publish immutable image
        id: ui
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.acr.outputs.login_server }}/s3proxy-ui:${{ github.sha }}
          provenance: mode=max
          sbom: true
          build-args: |
            OCI_REVISION=${{ github.sha }}

      - name: Pull immutable image
        env:
          UI_IMAGE: ${{ steps.acr.outputs.login_server }}/s3proxy-ui@${{ steps.ui.outputs.digest }}
        run: docker pull "$UI_IMAGE"

      - name: Verify image contents
        env:
          UI_IMAGE: ${{ steps.acr.outputs.login_server }}/s3proxy-ui@${{ steps.ui.outputs.digest }}
          UI_EXPECTED_REVISION: ${{ github.sha }}
        run: scripts/verify-ui-image.sh

      - name: Scan release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.acr.outputs.login_server }}/s3proxy-ui@${{ steps.ui.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Sign immutable image
        env:
          LOGIN_SERVER: ${{ steps.acr.outputs.login_server }}
          UI_DIGEST: ${{ steps.ui.outputs.digest }}
        run: cosign sign --yes "${LOGIN_SERVER}/s3proxy-ui@${UI_DIGEST}"

  deploy:
    name: Deploy signed UI to ${{ inputs.release_environment }} AKS
    if: inputs.deploy_to_aks
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-ui.yml
    with:
      deployment_environment: ${{ inputs.release_environment }}
      ui_digest: ${{ needs.publish.outputs.ui_digest }}
      ui_revision: ${{ needs.publish.outputs.ui_revision }}
      network_policy_enabled: ${{ inputs.network_policy_enabled }}
    secrets: inherit
