name: UI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  validate:
    name: Lint, unit, build, and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Audit dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org/

      - name: Validate generated API contract
        run: |
          expected="$(node -e "console.log(require('./contracts/backend-contract.json').openapi_sha256)")"
          actual="$(sha256sum contracts/admin-openapi.json | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || {
            echo "Pinned OpenAPI checksum does not match backend-contract.json" >&2
            exit 1
          }
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts src/api/generated

      - name: Run source validation
        run: scripts/release/validate-source.sh

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mocked browser acceptance
        run: npm run test:e2e

  browser-quality:
    name: Accessibility and cross-browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Build assets
        run: npm run build

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run accessibility acceptance
        run: npm run test:e2e:a11y

      - name: Run Firefox and WebKit smoke
        run: npm run test:e2e:cross-browser

  image:
    name: Runtime image contract and security
    needs: [validate, browser-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Build assets
        run: |
          npm ci --ignore-scripts --registry=https://registry.npmjs.org/
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: s3proxy-ui:ci
          build-args: |
            OCI_REVISION=${{ github.sha }}

      - name: Verify image contents
        env:
          UI_IMAGE: s3proxy-ui:ci
          UI_EXPECTED_REVISION: ${{ github.sha }}
        run: scripts/verify-ui-image.sh

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: s3proxy-ui:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Generate local SBOM
        run: mkdir -p sbom

      - name: Export local SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: s3proxy-ui:ci
          output-file: sbom/s3proxy-ui.spdx.json
          upload-artifact: false
